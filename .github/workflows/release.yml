name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})." >&2
            exit 1
          fi
      - name: Build release archives
        run: |
          git archive --format=tar.gz --prefix=boardroom/ --output=boardroom.tar.gz HEAD
          git archive --format=zip --prefix=boardroom/ --output=boardroom.zip HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            boardroom.tar.gz \
            boardroom.zip \
            --generate-notes \
            --verify-tag \
            --title "Boardroom ${GITHUB_REF_NAME}"
